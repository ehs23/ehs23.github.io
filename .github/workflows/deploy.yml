# GitHub Actions 화면에 표시될 Workflow 이름
name: Sync Notion and Deploy Blog


# ============================================================
# Workflow 실행 조건
# ============================================================

on:

  # 내가 직접 main 브랜치에 코드를 push했을 때도 실행
  push:
    branches:
      - main

  # 일정 시간마다 자동으로 실행
  schedule:
  # 매일 한국시간 정오 12시에 한 번 실행
  - cron: "0 12 * * *"
    timezone: "Asia/Seoul"


  # GitHub Actions 화면에서
  # "Run workflow" 버튼으로 직접 실행할 수도 있게 한다.
  workflow_dispatch:


# ============================================================
# 동시에 여러 배포가 실행되는 것을 방지
# ============================================================

concurrency:

  # 모든 Pages 배포를 같은 그룹으로 묶는다.
  group: notion-pages-${{ github.ref }}

  # 동기화 커밋 중간에 실행을 취소하지 않고 순서대로 처리한다.
  cancel-in-progress: false


# ============================================================
# 작업 시작
# ============================================================

jobs:


  # ==========================================================
  # 1. Notion 동기화 + Next.js 빌드
  # ==========================================================

  build:

    # GitHub에서 제공하는 Ubuntu 환경 사용
    runs-on: ubuntu-latest

    # 동기화와 Pages 설정에 필요한 권한만 이 작업에 부여한다.
    permissions:
      contents: write
      pages: write

    outputs:
      should_deploy: ${{ steps.commit.outputs.should_deploy }}

    steps:


      # ------------------------------------------------------
      # GitHub Repository 코드 가져오기
      # ------------------------------------------------------

      - name: Checkout

        # 현재 저장소의 코드를 GitHub Actions 서버로 가져온다.
        uses: actions/checkout@v6

        with:
          # 동기화 커밋을 최신 main 위로 안전하게 rebase할 수 있게 한다.
          fetch-depth: 0


      # ------------------------------------------------------
      # Node.js 설정
      # ------------------------------------------------------

      - name: Setup Node

        # Node.js 실행 환경을 설정한다.
        uses: actions/setup-node@v6

        with:

          # 우리가 로컬에서 사용했던 Node 24와 맞춘다.
          node-version: 24

          # npm dependency cache를 사용해 설치 속도를 높인다.
          cache: npm


      # ------------------------------------------------------
      # npm 패키지 설치
      # ------------------------------------------------------

      - name: Install dependencies

        # package-lock.json 기준으로
        # 정확한 dependency 버전을 설치한다.
        run: npm ci


      # ------------------------------------------------------
      # Notion → Markdown 동기화
      # ------------------------------------------------------

      - name: Sync Notion posts

        # GitHub Secrets를 환경변수로 전달한다.
        env:

          # Notion Connection Access Token
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

          # Blog Data Source ID
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}

        # 우리가 만든 동기화 프로그램 실행
        run: node scripts/sync-notion.mjs


      # ------------------------------------------------------
      # 동기화된 Markdown을 GitHub에 저장
      # ------------------------------------------------------

      - name: Commit synced posts

        id: commit

        run: |

          # GitHub Actions가 생성하는 commit의 작성자 정보 설정
          git config user.name "notion-blog-bot"
          git config user.email "actions@github.com"


          # 동기화된 글과 Notion 첨부파일의
          # 생성/수정/삭제를 모두 Git staging에 추가
          git add -A -- content/posts content/notion-blocks public/notion-assets


          # 변경된 파일이 없다면 commit하지 않고 종료
          if git diff --cached --quiet; then

            echo "변경된 Notion 글이 없습니다."

            # 예약 실행에서 글이 그대로라면 빌드와 재배포도 생략한다.
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            fi

          else

            # 변경사항이 있으면 자동 commit 생성
            git commit -m "Sync Notion posts"


            # 실행 중 main이 바뀌었을 수 있으므로 최신 커밋 위로 정리한다.
            git pull --rebase origin main

            # 현재 main 브랜치로 자동 push
            git push origin HEAD:main

            echo "should_deploy=true" >> "$GITHUB_OUTPUT"

          fi


      # ------------------------------------------------------
      # Next.js 정적 사이트 빌드
      # ------------------------------------------------------

      - name: Build Next.js

        if: steps.commit.outputs.should_deploy == 'true'

        # next.config.ts의 output: "export" 설정에 의해
        # 최종 정적 사이트가 out/ 폴더에 생성된다.
        run: npm run build


      # ------------------------------------------------------
      # GitHub Pages 설정
      # ------------------------------------------------------

      - name: Setup Pages

        if: steps.commit.outputs.should_deploy == 'true'

        # GitHub Pages 배포 환경 설정
        uses: actions/configure-pages@v6


      # ------------------------------------------------------
      # out 폴더 업로드
      # ------------------------------------------------------

      - name: Upload Pages artifact

        if: steps.commit.outputs.should_deploy == 'true'

        # GitHub Pages가 배포할 정적 파일을 업로드한다.
        uses: actions/upload-pages-artifact@v4

        with:

          # Next.js static export 결과
          path: ./out


  # ==========================================================
  # 2. GitHub Pages 실제 배포
  # ==========================================================

  deploy:

    # build가 성공한 뒤에만 실행한다.
    needs: build

    # 예약 동기화에 변경이 없으면 배포 작업 자체를 건너뛴다.
    if: needs.build.outputs.should_deploy == 'true'

    # 실제 Pages 배포에 필요한 최소 권한만 부여한다.
    permissions:
      actions: read
      pages: write
      id-token: write

    # GitHub Pages 공식 Environment
    environment:

      # GitHub Pages environment 이름
      name: github-pages

      # 배포 완료 후 생성된 URL을 등록
      url: ${{ steps.deployment.outputs.page_url }}


    # Ubuntu 서버에서 실행
    runs-on: ubuntu-latest


    steps:

      # ------------------------------------------------------
      # GitHub Pages 배포
      # ------------------------------------------------------

      - name: Deploy GitHub Pages

        # 아래에서 page_url을 가져오기 위해 ID 지정
        id: deployment

        # 앞에서 업로드한 out/ artifact를 실제 Pages로 배포
        uses: actions/deploy-pages@v4
